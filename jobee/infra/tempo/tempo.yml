# Minimal single-binary Tempo config.
# Receives OTLP traces from services on 4317 (gRPC) and 4318 (HTTP).
# Uses local-disk storage. All non-essential blocks rely on Tempo's defaults.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
